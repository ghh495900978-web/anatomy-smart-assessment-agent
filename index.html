<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人体解剖学形成性评价智能体</title><style>body{margin:0;background:#f4f7f9;color:#18232d;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.title{font-size:26px;font-weight:800}.muted{color:#687783;font-size:12px}.status{background:#e8f6ee;color:#16794b;border-radius:99px;padding:6px 10px;font-size:12px}.tabs{display:flex;gap:4px;border-bottom:1px solid #d9e1e7;margin:18px 0}.tab{border:0;background:transparent;padding:10px 14px}.tab.active{background:white;color:#1769d1;border:1px solid #d9e1e7;font-weight:700}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{background:#fff;border:1px solid #d9e1e7;border-radius:8px;padding:16px}.panel h1{font-size:21px;margin:0 0 14px}.panel h2{font-size:16px;border-left:3px solid #1769d1;padding-left:8px;margin:20px 0 9px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-weight:700}.field input,.field textarea{width:100%;border:1px solid #d9e1e7;border-radius:6px;padding:8px}.field textarea{height:290px;font:12px Consolas,monospace}.actions{display:flex;gap:8px;margin-top:10px}button{border:1px solid #d9e1e7;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}button.primary{background:#1769d1;color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid #d9e1e7;border-radius:6px;padding:10px}.metric b{display:block;font-size:21px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #e5eaee;padding:7px;text-align:left}.table th{color:#687783;font-size:12px}.chip{display:inline-block;border:1px solid #d9e1e7;border-radius:99px;padding:4px 8px;margin:3px}.good{color:#16794b;background:#f0faf4}.callout{padding:10px;border-left:3px solid #925900;background:#fff8ed}.stage{border:1px solid #d9e1e7;border-radius:6px;padding:11px;margin:8px 0}.stage strong{display:flex;justify-content:space-between}.hidden{display:none}.footer{margin-top:16px;color:#687783;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style><body><main class="wrap"><header class="top"><div><div class="muted">TEACHING AGENT · ANATOMY</div><div class="title">人体解剖学形成性评价智能体</div><div class="muted">测评归集 · 学情诊断 · 阶梯路径 · 班级汇总</div></div><div class="status">本地演示 · 数据不上传</div></header><div class="module-strip" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0"><div class="panel"><b>01 解剖学知识库</b><br><span class="muted">教材术语与依赖</span></div><div class="panel"><b>02 形成性评价测评引擎</b><br><span class="muted">出题、作答、判分</span></div><div class="panel"><b>03 学情诊断推理</b><br><span class="muted">错因与根源薄弱点</span></div><div class="panel"><b>04 学习路径规划</b><br><span class="muted">三阶段任务</span></div><div class="panel"><b>05 师生交互输出</b><br><span class="muted">报告与班级汇总</span></div></div><nav class="tabs"><button class="tab active" data-v="student">学生端</button><button class="tab" data-v="teacher">教师端</button></nav><section id="student" class="grid"><aside class="panel"><h2>提交测评数据</h2><button class="primary" id="startQuiz">开始直接答题</button><p class="muted">课堂操作：点击开始答题，完成题目后点击提交测评。</p><div class="field"><label>学习时长（分钟）</label><input id="minutes" type="number" min="10" value="45"></div><div class="field"><label>测评 JSON</label><textarea id="payload"></textarea></div><div class="actions"><button class="primary" id="run">生成诊断报告</button><button id="load">载入示例</button></div><p class="muted">支持单选、多选、填空、识图题；身份字段不会进入报告。</p></aside><article class="panel"><div id="quizBox"></div><div id="studentReport"></div></article></section><section id="teacher" class="grid hidden"><aside class="panel"><h2>班级汇总设置</h2><div class="field"><label>高频薄弱知识点 Top N</label><input id="topn" type="number" min="1" value="5"></div><div class="field"><label>脱敏班级 JSON</label><textarea id="cohort"></textarea></div><div class="actions"><button class="primary" id="runTeacher">生成班级汇总</button><button id="loadTeacher">载入示例</button></div></aside><article id="teacherReport" class="panel"></article></section><div class="footer">本智能体为学习辅助工具，内容仅供参考；关键知识点请以人卫版教材以及任课教师授课为准，疑难问题请咨询授课教师。</div></main><script>
const G={"肱肌":{m:"运动系统",p:["肱骨骨性结构"],f:"图谱与形态—功能对照"},"肱骨骨性结构":{m:"运动系统",p:[],f:"骨性标志归纳与无标注图"},"肝的毗邻":{m:"内脏学",p:["肝的形态与分叶"],f:"三维图谱与毗邻标注"},"肝的形态与分叶":{m:"内脏学",p:[],f:"归纳文本与图谱"},"心脏传导系":{m:"脉管系统",p:["心脏的位置和形态"],f:"结构—功能思维导图"},"心脏的位置和形态":{m:"脉管系统",p:[],f:"三维图谱与定位练习"}};
const S={questions:[{module:"运动系统",knowledgePoint:"肱肌",answer:"B",correct:"A",score:20,errorType:"D",brief:"肱肌的起止与作用"},{module:"运动系统",knowledgePoint:"肱骨骨性结构",answer:"小头",correct:"大结节",score:20,errorType:"C",brief:"肱骨标志识图"},{module:"内脏学",knowledgePoint:"肝的毗邻",answer:["A","C"],correct:["A","B","C"],score:20,errorType:"B",brief:"肝的毗邻关系"},{module:"内脏学",knowledgePoint:"肝的形态与分叶",answer:"肝左叶",correct:["左叶","肝左叶"],score:20,errorType:"A",brief:"肝的分叶术语"}]};function esc(x){return String(x??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}function mark(q){let p=+q.score||0,g=0,r="错误";if(q.type==="multiple"){let a=q.answer||[],c=q.correct||[],C=a.filter(x=>c.includes(x)).length,W=a.filter(x=>!c.includes(x)).length;g=p*Math.max(0,(C-W)/c.length);r=g>=p?"正确":g?"部分正确":"错误"}else if(String(q.answer).trim()===String(Array.isArray(q.correct)?q.correct[0]:q.correct).trim()){g=p;r="正确"}return {...q,g,r}}function diag(d){let q=(d.questions||[]).map(markFixed),w=q.filter(x=>x.r!=="正确"),total=q.reduce((s,x)=>s+(+x.score||0),0),got=q.reduce((s,x)=>s+x.g,0),mods={};q.forEach(x=>(mods[x.module]??=[]).push(x));let ex={};w.forEach(x=>(ex[x.knowledgePoint]??={n:0,t:[]},ex[x.knowledgePoint].n++,ex[x.knowledgePoint].t.push(x.errorType||"待判定")));let E=Object.entries(ex).map(([k,v])=>({k,...v,state:v.n>1?"完全未掌握":"部分掌握"})),R=[];E.forEach(x=>(G[x.k]?.p||[]).forEach(p=>R.push({k:p,for:x.k,c:E.some(e=>e.k===p)?"中":"低"})));let T={A:0,B:0,C:0,D:0,"待判定":0};w.forEach(x=>T[x.errorType||"待判定"]++);return{q,w,total,got,acc:total?got/total:0,mods,E,R,T}}
function report(d){let q=(d.q||d.questions||[]).map(markFixed),w=q.filter(x=>x.r!=="正确"),tot=q.reduce((s,x)=>s+x.score,0),got=q.reduce((s,x)=>s+x.g,0),mods={};q.forEach(x=>(mods[x.module]??=[]).push(x));return "<h1>解剖学形成性学习诊断报告</h1><h2>📝本次形成性测评概况</h2><div class=metrics><div class=metric><b>"+got.toFixed(1)+"/"+tot+"</b><span class=muted>得分</span></div><div class=metric><b>"+(got/tot*100).toFixed(1)+"%</b><span class=muted>总体正确率</span></div><div class=metric><b>"+q.length+"</b><span class=muted>总题量</span></div><div class=metric><b>"+w.length+"</b><span class=muted>待复盘题数</span></div></div><h2>📊学情诊断分析</h2><p>需要巩固："+(w.map(x=>esc(x.knowledgePoint)).join("、")||"本次未发现错题")+"。</p><h2>🚀你的个性化学习路径</h2><div class=stage><strong>阶段1：基础补学 <span class=muted>建议 18 分钟</span></strong><p>先核对相关前置知识点的教材定义、结构定位和图谱。</p></div><div class=stage><strong>阶段2：针对性强化训练 <span class=muted>建议 18 分钟</span></strong><p>完成对应错题知识点的名词、识图、毗邻关系或案例变式练习。</p></div><div class=stage><strong>阶段3：复盘校验测评 <span class=muted>建议 9 分钟</span></strong><p>完成覆盖薄弱知识点的自测题，正确率达到80%后再次测评。</p></div><h2>📌错题摘要</h2><table class=table><tr><th>知识点</th><th>类型</th><th>摘要</th></tr>"+w.map(x=>"<tr><td>"+esc(x.knowledgePoint)+"</td><td>"+esc(x.errorType||"待判定")+"</td><td>"+esc(x.brief)+"</td></tr>").join("")+"</table><h2>⚠️使用提示</h2><div class=callout>本智能体为学习辅助工具，内容仅供参考；关键知识点请以人卫版教材以及任课教师授课为准，疑难问题请咨询授课教师。</div>"}function loadSample(){payload.value=JSON.stringify(S,null,2);cohort.value=JSON.stringify(Array.from({length:12},()=>S),null,2)}loadSample();document.getElementById('run').onclick=()=>{try{let dd=diag(JSON.parse(payload.value));studentReport.innerHTML="<div class=callout><b>学生操作流程：</b>1.查看测评结果；2.按阶段1、2完成学习；3.完成下方阶段3自测；4.达到80%后再次提交测评。</div>"+renderStudentFull(dd)+selfTestHtml(dd);bindSelfTest(dd)}catch(e){studentReport.innerHTML="<div class=callout>JSON格式无法解析。</div>"}};runTeacher.onclick=()=>{try{teacherReport.innerHTML=teacherReportHtml(JSON.parse(cohort.value),+topn.value||10)}catch(e){teacherReport.innerHTML="<div class=callout>班级 JSON 格式无法解析。</div>"}};document.getElementById('load').onclick=loadSample;document.getElementById('loadTeacher').onclick=loadSample;document.getElementById('run').click();document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.v).classList.remove("hidden")});
function teacherReportHtml(rs,N){let q=rs.flatMap(r=>(r.questions||[]).map(markFixed)),w=q.filter(x=>x.r!=="正确"),M={};q.forEach(x=>(M[x.module]??={c:0,v:0},M[x.module].v++,x.r==="正确"&&M[x.module].c++));let K={};w.forEach(x=>(K[x.knowledgePoint]??={n:0,t:[]},K[x.knowledgePoint].n++,K[x.knowledgePoint].t.push(x.errorType||"待判定")));let T={A:0,B:0,C:0,D:0,"待判定":0};w.forEach(x=>T[x.errorType||"待判定"]++);let top=Object.entries(K).sort((a,b)=>b[1].n-a[1].n).slice(0,N),small=rs.length<10;return "<h1>解剖学课程班级形成性学情汇总报告</h1><h2>1. 班级整体测评概况</h2><div class=metrics><div class=metric><b>"+rs.length+"</b><span class=muted>脱敏样本数</span></div><div class=metric><b>"+(q.filter(x=>x.r==="正确").length/Math.max(q.length,1)*100).toFixed(1)+"%</b><span class=muted>班级总体正确率</span></div><div class=metric><b>"+q.length+"</b><span class=muted>有效题数</span></div><div class=metric><b>"+w.length+"</b><span class=muted>错题数</span></div></div>"+(small?"<div class=callout>样本量有限（少于10人），已隐藏涉及人数。</div>":"")+"<h2>2. 各知识模块正确率统计</h2><table class=table><tr><th>模块</th><th>正确题数</th><th>有效题数</th><th>正确率</th></tr>"+Object.entries(M).map(([m,v])=>"<tr><td>"+esc(m)+"</td><td>"+v.c+"</td><td>"+v.v+"</td><td>"+(v.c/v.v*100).toFixed(1)+"%</td></tr>").join("")+"</table><h2>3. 班级高频薄弱知识点排行（Top "+N+"）</h2><table class=table><tr><th>排名</th><th>知识点</th><th>错题数</th><th>主要错误类型</th></tr>"+top.map(([k,v],i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(k)+"</td><td>"+v.n+"</td><td>"+[...new Set(v.t)].join("、")+"</td></tr>").join("")+"</table><h2>4. 班级主要错误类型分布</h2><table class=table><tr><th>类型</th><th>错误题数</th><th>占全部错题比例</th></tr>"+Object.entries(T).filter(([,v])=>v).map(([k,v])=>"<tr><td>"+k+"</td><td>"+v+"</td><td>"+(v/Math.max(w.length,1)*100).toFixed(1)+"%</td></tr>").join("")+"</table><h2>5. 课堂教学优化参考建议</h2>"+Object.entries(T).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v],i)=>"<div class=stage><strong>"+(i===0?"立即调整":i===1?"下一单元调整":"持续巩固")+"</strong><p>"+k+"类错误占 "+(v/Math.max(w.length,1)*100).toFixed(1)+"%，建议开展"+(k==="A"?"名词对比归纳":k==="B"?"三维图谱与毗邻演示":k==="C"?"无标注图识别训练":"结构—功能—损伤表现案例")+"。</p></div>").join("")}
function renderStudentFull(d){let good=Object.entries(d.mods).filter(([,a])=>a.filter(x=>x.r==="正确").length/a.length>=.8),rows=Object.entries(d.mods).map(([m,a])=>{let z=a.filter(x=>x.r==="正确").length/a.length;return "<tr><td>"+esc(m)+"</td><td>"+(z*100).toFixed(1)+"%</td><td>"+(z>=.8?"掌握良好":"需要巩固")+"</td></tr>"}).join(""),points=good.flatMap(([,a])=>a.filter(x=>x.r==="正确").map(x=>x.knowledgePoint)).filter((x,i,a)=>a.indexOf(x)===i).join("、")||"暂无";let h=report(d);return h.replace("<h2>📊学情诊断分析</h2>","<h2>模块掌握概况</h2><table class=table><tr><th>知识模块</th><th>正确率</th><th>掌握概况</th></tr>"+rows+"</table><h2>📊学情诊断分析</h2>").replace("<p>需要巩固：","<p class=muted>掌握良好的三级知识点："+esc(points)+"</p><p>需要巩固：")}
function markFixed(q){let p=+q.score||0,g=0,r="错误",norma=x=>String(x??"").trim().replace(/[\\s　，。；;、]/g,"").toLowerCase();if(q.type==="multiple"){let a=Array.isArray(q.answer)?q.answer:[],c=Array.isArray(q.correct)?q.correct:[],C=a.filter(x=>c.includes(x)).length,W=a.filter(x=>!c.includes(x)).length;g=p*Math.max(0,(C-W)/Math.max(c.length,1));r=g>=p?"正确":g>0?"部分正确":"错误"}else if(q.type==="fill"){let a=norma(q.answer),c=(Array.isArray(q.correct)?q.correct:[q.correct]).map(norma);if(c.includes(a)){g=p;r="正确"}}else if(norma(q.answer)===norma(q.correct)){g=p;r="正确"}return {...q,g,r}}function selfTestHtml(d){let qs=d.q.slice(0,Math.max(3,d.q.length));return "<h2>阶段3：自测校验</h2><p class=muted>请重新作答以下题目，不查看答案；完成后点击“提交自测”。相关知识点正确率达到80%即可进入再次形成性测评。</p><div id=selfQuestions>"+qs.map((q,i)=>"<div class=stage><strong>"+(i+1)+"．"+esc(q.brief||q.knowledgePoint)+"</strong><div class=muted>"+esc(q.knowledgePoint)+" · "+esc(q.type||"题目")+"</div><input class=self-answer data-i="+i+" placeholder="+(q.type==="multiple"?"多选请填写 A,B,C":"请输入答案")+"></div>").join("")+"</div><button class=primary id=submitSelf>提交自测</button><div id=selfResult></div>"}function bindSelfTest(d){document.getElementById("submitSelf").onclick=()=>{let qs=d.q.slice(0,Math.max(3,d.q.length)),pass=0;qs.forEach((q,i)=>{let v=document.querySelector('.self-answer[data-i="'+i+'"]').value.trim();let a=q.type==="multiple"?v.split(/[,，、\\s]+/).filter(Boolean):v;if(markFixed({...q,answer:a}).r==="正确")pass++});let rate=pass/qs.length;document.getElementById("selfResult").innerHTML="<div class="+(rate>=.8?"good":"callout")+">自测结果："+pass+"/"+qs.length+"，正确率 "+(rate*100).toFixed(1)+"%。"+(rate>=.8?"已达到80%通过标准，可以再次进行形成性测评。":"尚未达到80%，请回到阶段1或阶段2继续巩固后再测。")+"</div>"}}
const DIRECT_QUIZ={title:"人体解剖学课堂形成性测评",questions:[{id:1,type:"single",module:"运动系统",knowledgePoint:"肱肌",prompt:"肱肌的主要作用是？",options:["屈肘关节","伸肘关节","外展肩关节","旋前前臂"],correct:"A",score:20,errorType:"D",brief:"肱肌的起止与作用"},{id:2,type:"single",module:"运动系统",knowledgePoint:"肱骨骨性结构",prompt:"肱骨近端的骨性标志是？",options:["大结节","冠突","尺骨鹰嘴","桡骨头"],correct:"A",score:20,errorType:"C",brief:"肱骨标志辨认"},{id:3,type:"multiple",module:"内脏学",knowledgePoint:"肝的毗邻",prompt:"与肝脏形成重要毗邻关系的结构包括？",options:["胃","右肾","脾","胆囊"],correct:["A","B","D"],score:20,errorType:"B",brief:"肝的毗邻关系"},{id:4,type:"fill",module:"内脏学",knowledgePoint:"肝的形态与分叶",prompt:"肝脏膈面以镰状韧带分为肝___和肝右叶。",correct:["左叶","肝左叶"],score:20,errorType:"A",brief:"肝的分叶术语"},{id:5,type:"single",module:"脉管系统",knowledgePoint:"心脏传导系",prompt:"心脏传导系不包括？",options:["窦房结","房室结","Purkinje纤维","冠状窦"],correct:"D",score:20,errorType:"D",brief:"传导系组成"}]};function renderDirectQuiz(){let q=DIRECT_QUIZ.questions;quizBox.innerHTML="<h2>课堂形成性测评</h2><p class=muted>请完成全部题目，确认后点击“提交测评”。</p>"+q.map((x,i)=>{let body=x.type==="fill"?'<input class=direct-fill data-i="'+i+'" placeholder="请输入答案">':x.options.map((o,j)=>{let l=String.fromCharCode(65+j),t=x.type==="multiple"?"checkbox":"radio";return '<label class=option><input type="'+t+'" name="direct'+i+'" value="'+l+'">'+l+". "+esc(o)+"</label>"}).join("");return '<div class=quiz-q><div class=qtitle>'+(i+1)+"．"+esc(x.prompt)+"</div><div class=muted>"+esc(x.module)+" · "+esc(x.knowledgePoint)+" · "+x.type+"</div>"+body+"</div>"}).join("")+'<button class=primary id=submitDirect>提交测评</button>' ;document.getElementById("submitDirect").onclick=()=>{let qs=q.map((x,i)=>{let a;if(x.type==="fill")a=document.querySelector('.direct-fill[data-i="'+i+'"]').value.trim();else{let z=[...document.querySelectorAll('input[name="direct'+i+'"]:checked')];a=x.type==="multiple"?z.map(y=>y.value):(z[0]?.value||"")}return {...x,answer:a}});let d=diag({title:DIRECT_QUIZ.title,questions:qs});studentReport.innerHTML="<div class=callout><b>已提交测评。</b>请查看下方报告，按阶段完成学习，再进行阶段3自测。</div>"+renderStudentFull(d)+selfTestHtml(d);bindSelfTest(d)}};document.getElementById("startQuiz").onclick=renderDirectQuiz;
</script></body></html>
